<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>We belong 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <h1>💖 Our Love Space</h1>
  <input id="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- NAV -->
  <nav>
    <button onclick="openTab('home')">🏠</button>
    <button onclick="openTab('pet')">🐾</button>
    <button onclick="openTab('games')">🎮</button>
    <button onclick="openTab('call')">📞</button>
    <button onclick="toggleTheme()">🎨</button>
    <button onclick="logout()">🚪</button>
  <button onclick="showTab('movie')">Movie Night</button>
  </nav>

  <!-- HOME -->
  <section id="home" class="tab">
    <h2>Your Mood 💭</h2>
    <input id="moodInput" placeholder="How are you feeling?" />
    <button onclick="saveMood()">Save</button>
    <p id="moodDisplay"></p>

    <div class="nudge">
      💌 Love Nudge: Send one sweet message today.
    </div>
  </section>

  <!-- PET -->
  <section id="pet" class="tab hidden">
  <div id="petArea">
    <img id="petImage" src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" />
  </div>
    <button onclick="feedPet()">🍎 Feed</button>
    <button onclick="playPet()">🎾 Play</button>
    <button onclick="changePet()">👗 Change</button>
    <img class="plant" src="assets/ui/plant.png" />
    <img class="butterfly" src="assets/ui/butterfly.gif" />
  </section>

  <!-- GAMES -->
  <section id="games" class="tab hidden">
    <h2>Tic Tac Toe</h2>
    <div id="board"></div>
    <p id="gameStatus"></p>
  </section>

  <!-- CALL -->
  <section id="call" class="tab hidden">
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>
    <button onclick="startCall()">Start Call</button>
    <button onclick="shareScreen()">Share Screen</button>
  </section>
  
<!-- 🎬 MOVIE NIGHT -->
<section id="movie" class="tab hidden">
  <h2>Movie Night 🎬</h2>
  <input id="movieUrl" placeholder="Paste MP4 / Drive direct link" />
  <button onclick="loadMovie()">Load</button>
  <video id="sharedMovie" controls></video>
</section>  
</div>

<script src="app.js"></script>
</body>
</html>
